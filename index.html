<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desa Piksel: Quest 10 Warga</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            touch-action: none; /* Mencegah pull-to-refresh di HP */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Aspect ratio 9:16 (1080x1920) disesuaikan dengan layar */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 54vh; /* max-width untuk menjaga rasio 9:16 di layar lebar */
            object-fit: cover;
            background-color: #4a8505; /* Warna dasar rumput */
            image-rendering: pixelated; /* Mempertahankan ketajaman piksel */
        }

        /* UI OVERLAYS */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 54vh;
            height: 100%;
            pointer-events: none; /* Agar klik tembus ke tombol di dalamnya */
        }

        #quest-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 4px solid #fff;
            color: #fff;
            padding: 15px;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
        }

        #dialog-box {
            display: none;
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: #222;
            border: 6px solid #d4af37;
            color: #fff;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: auto; /* Bisa diklik untuk menutup */
            cursor: pointer;
        }

        .dialog-name {
            color: #ffeb3b;
            margin-bottom: 10px;
            font-size: 16px;
        }

        /* KONTROL JOYSTICK & TOMBOL (Bisa disentuh) */
        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            pointer-events: auto;
        }

        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }

        #joystick-knob {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        #action-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: #d32f2f;
            border: 4px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-family: inherit;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        #action-btn:active { background: #b71c1c; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1080" height="1920"></canvas>
    
    <div id="ui-layer">
        <div id="quest-bar">Quest: Temui Kakek Ardi!</div>
        
        <div id="dialog-box" onclick="closeDialog()">
            <div class="dialog-name" id="d-name">Nama NPC</div>
            <div id="d-text">Teks dialog disini...</div>
            <div style="font-size:10px; color:#aaa; margin-top:15px; text-align:right;">(Ketuk untuk tutup)</div>
        </div>

        <div id="controls">
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
            <div id="action-btn">A</div>
        </div>
    </div>
</div>

<script>
    // Pastikan kode berjalan setelah seluruh HTML dimuat
    window.onload = function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimasi performa

        // Elemen UI
        const questBar = document.getElementById('quest-bar');
        const dialogBox = document.getElementById('dialog-box');
        const dName = document.getElementById('d-name');
        const dText = document.getElementById('d-text');
        
        // State Permainan
        let currentScene = 'outdoor'; // 'outdoor' atau 'indoor'
        let currentQuest = 1; // 1 sampai 10
        let isDialogActive = false;

        // Ukuran Dunia (Kamera)
        const WORLD_W = 2000;
        const WORLD_H = 3000;
        
        // Objek Pemain
        const player = {
            x: 540,
            y: 960,
            width: 60,
            height: 80,
            speed: 8,
            vx: 0,
            vy: 0,
            color: '#1976d2',
            facing: 'down',
            animOffset: 0
        };

        // Kamera
        const camera = { x: 0, y: 0 };

        // Definisi 10 NPC (Quest Berurutan)
        const npcs = [
            { id: 1, name: "Kakek Ardi", x: 600, y: 1200, color: '#795548', scene: 'outdoor', hasQuest: true, dialog: "Halo Nak, tolong cari Nenek Juariah di dalam rumah. Katakan padanya aku mencari kacamata.", doneDialog: "Terima kasih sudah membantuku." },
            { id: 2, name: "Nenek Juariah", x: 500, y: 1000, color: '#e91e63', scene: 'indoor', hasQuest: false, dialog: "Kacamata Kakek? Ah, coba siram tanaman di luar dulu, baru nenek kasih tahu.", doneDialog: "Tanaman sudah segar! Kacamatanya ada di tukang kayu." },
            { id: 3, name: "Tukang Kayu", x: 1200, y: 800, color: '#f57c00', scene: 'outdoor', hasQuest: false, dialog: "Nenek menyuruhmu? Baiklah. Tapi bawakan aku 1 kayu dari hutan atas.", doneDialog: "Kerja bagus. Ini kacamatanya. Eh, berikan ini ke Petani juga ya." },
            { id: 4, name: "Petani", x: 300, y: 500, color: '#388e3c', scene: 'outdoor', hasQuest: false, dialog: "Wah, benih dari tukang kayu! Tolong tanam ini di ladang sebelah sana.", doneDialog: "Pintar sekali bertani. Temui nelayan di dekat danau, dia butuh bantuan." },
            { id: 5, name: "Nelayan", x: 1600, y: 2200, color: '#0288d1', scene: 'outdoor', hasQuest: false, dialog: "Pancingku tersangkut. Bisakah kau tanya pandai besi bagaimana cara melepasnya?", doneDialog: "Ikannya besar! Terima kasih." },
            { id: 6, name: "Pandai Besi", x: 800, y: 1500, color: '#455a64', scene: 'outdoor', hasQuest: false, dialog: "Ah, potong saja talinya. Ngomong-ngomong, sampaikan salamku ke penjual bunga.", doneDialog: "Toko apiku sedang sibuk." },
            { id: 7, name: "Penjual Bunga", x: 1400, y: 1000, color: '#c2185b', scene: 'outdoor', hasQuest: false, dialog: "Salam dari pandai besi? Manisnya. Tolong petikkan 1 bunga merah untukku.", doneDialog: "Bunga yang indah. Wali Kota mencarimu tadi." },
            { id: 8, name: "Wali Kota", x: 540, y: 500, color: '#512da8', scene: 'indoor', hasQuest: false, dialog: "Desa kita sedang bersiap festival. Tolong kumpulkan pajak dari pedagang.", doneDialog: "Terima kasih, desa ini aman bersamamu." },
            { id: 9, name: "Pedagang", x: 1000, y: 2500, color: '#ffb300', scene: 'outdoor', hasQuest: false, dialog: "Ini pajaknya. Oh ya, ada anak kecil menangis di dekat hutan, coba periksa.", doneDialog: "Jual beli lancar hari ini." },
            { id: 10, name: "Anak Kecil", x: 200, y: 2800, color: '#00acc1', scene: 'outdoor', hasQuest: false, dialog: "Balonku hilang... Hore, kau menemukannya! Terima kasih, pahlawan desa!", doneDialog: "Aku suka main di desa ini." }
        ];

        // Objek Interaktif Lingkungan
        const objects = [
            { type: 'house', x: 400, y: 700, w: 300, h: 250, scene: 'outdoor', interact: 'Masuk Rumah', targetScene: 'indoor', tx: 540, ty: 1700 },
            { type: 'door', x: 450, y: 1800, w: 180, h: 100, scene: 'indoor', interact: 'Keluar', targetScene: 'outdoor', tx: 540, ty: 1000 },
            { type: 'water_plant', x: 800, y: 1200, w: 100, h: 100, scene: 'outdoor', interact: 'Siram Tanaman', questTarget: 2 },
            { type: 'tree', x: 1100, y: 400, w: 120, h: 180, scene: 'outdoor', interact: 'Ambil Kayu', questTarget: 3 },
            { type: 'field', x: 200, y: 200, w: 200, h: 200, scene: 'outdoor', interact: 'Tanam Benih', questTarget: 4 },
            { type: 'flower', x: 1600, y: 1200, w: 60, h: 60, scene: 'outdoor', interact: 'Petik Bunga', questTarget: 7 },
            { type: 'house_mayor', x: 400, y: 300, w: 300, h: 250, scene: 'outdoor', interact: 'Kantor Wali Kota', targetScene: 'indoor', tx: 540, ty: 1700 }
        ];

        // Fungsi Update Quest
        function updateQuestInfo() {
            if (currentQuest <= 10) {
                const target = npcs.find(n => n.id === currentQuest);
                questBar.innerText = `Quest ${currentQuest}/10: Temui ${target.name} ${target.scene === currentScene ? '(Di sini)' : '(Di tempat lain)'}`;
                // Set status aktif
                npcs.forEach(n => {
                    if(n.id === currentQuest) n.hasQuest = true;
                });
            } else {
                questBar.innerText = "Selamat! Semua 10 Quest Telah Selesai!";
                questBar.style.color = "#ffeb3b";
            }
        }

        // Buka / Tutup Dialog (Global variable functions for UI click)
        window.closeDialog = function() {
            dialogBox.style.display = 'none';
            isDialogActive = false;
        };

        function showDialog(name, text) {
            dName.innerText = name;
            dText.innerText = text;
            dialogBox.style.display = 'block';
            isDialogActive = true;
        }

        // --- SISTEM INPUT (JOYSTICK & TOMBOL) ---
        const joystick = document.getElementById('joystick-area');
        const knob = document.getElementById('joystick-knob');
        const actionBtn = document.getElementById('action-btn');
        let joyActive = false;
        let joyOrigin = { x: 0, y: 0 };

        joystick.addEventListener('touchstart', (e) => {
            joyActive = true;
            const rect = joystick.getBoundingClientRect();
            joyOrigin = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            handleJoystick(e.touches[0]);
        }, {passive: false});

        joystick.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            e.preventDefault();
            handleJoystick(e.touches[0]);
        }, {passive: false});

        joystick.addEventListener('touchend', () => {
            joyActive = false;
            knob.style.transform = `translate(0px, 0px)`;
            player.vx = 0;
            player.vy = 0;
        });

        function handleJoystick(touch) {
            let dx = touch.clientX - joyOrigin.x;
            let dy = touch.clientY - joyOrigin.y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            let maxDist = 30; // Batas radius gerak knob

            if (distance > maxDist) {
                dx = (dx / distance) * maxDist;
                dy = (dy / distance) * maxDist;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Normalisasi speed
            player.vx = (dx / maxDist) * player.speed;
            player.vy = (dy / maxDist) * player.speed;
        }

        // Input Keyboard (Untuk test di PC)
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if(e.key === ' ') handleAction(); });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Tombol Aksi
        actionBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(); });
        actionBtn.addEventListener('mousedown', (e) => { handleAction(); });

        // Logika Interaksi Aksi
        function handleAction() {
            if (isDialogActive) {
                closeDialog();
                return;
            }

            // Jarak jangkauan interaksi (Radius kotak)
            const interactRange = 100; 
            const px = player.x + player.width/2;
            const py = player.y + player.height/2;

            // 1. Cek Interaksi dengan NPC
            for (let npc of npcs) {
                if (npc.scene === currentScene) {
                    const nx = npc.x + 30;
                    const ny = npc.y + 40;
                    const dist = Math.sqrt(Math.pow(px - nx, 2) + Math.pow(py - ny, 2));

                    if (dist < interactRange) {
                        if (npc.id === currentQuest) {
                            showDialog(npc.name, npc.dialog);
                            
                            // Jika bukan quest objek tambahan, langsung lanjut
                            const requiresObject = objects.some(o => o.questTarget === npc.id);
                            if (!requiresObject) {
                                npc.hasQuest = false;
                                currentQuest++;
                                updateQuestInfo();
                            }
                        } else {
                            showDialog(npc.name, npc.doneDialog);
                        }
                        return; // Selesai interaksi
                    }
                }
            }

            // 2. Cek Interaksi dengan Objek / Pintu
            for (let obj of objects) {
                if (obj.scene === currentScene) {
                    const ox = obj.x + obj.w/2;
                    const oy = obj.y + obj.h/2;
                    const dist = Math.sqrt(Math.pow(px - ox, 2) + Math.pow(py - oy, 2));

                    if (dist < interactRange + 50) {
                        // Pindah Scene (Masuk Rumah)
                        if (obj.targetScene) {
                            currentScene = obj.targetScene;
                            player.x = obj.tx;
                            player.y = obj.ty;
                            updateQuestInfo();
                            return;
                        }

                        // Mengerjakan tugas objek
                        if (obj.questTarget === currentQuest) {
                            showDialog("Sistem", `Misi [${obj.interact}] selesai!`);
                            currentQuest++;
                            updateQuestInfo();
                            return;
                        }
                    }
                }
            }
        }

        // --- SISTEM UPDATE & GAMBAR (RENDER) ---

        function drawRectPixel(ctx, x, y, w, h, color, camX, camY) {
            ctx.fillStyle = color;
            ctx.fillRect(x - camX, y - camY, w, h);
        }

        function drawBackground() {
            // Latar Belakang Dasar
            if (currentScene === 'outdoor') {
                ctx.fillStyle = '#4a8505'; // Hijau rumput
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Jalan tanah sederhana (Dithering effect manual)
                ctx.fillStyle = '#8d6e63';
                ctx.fillRect(400 - camera.x, 0 - camera.y, 200, WORLD_H);
                
                // Danau
                ctx.fillStyle = '#0288d1';
                ctx.fillRect(1500 - camera.x, 2000 - camera.y, 500, 1000);
            } else {
                ctx.fillStyle = '#3e2723'; // Kayu gelap (Lantai dalam)
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Karpet
                ctx.fillStyle = '#b71c1c';
                ctx.fillRect(300 - camera.x, 800 - camera.y, 480, 400);
            }
        }

        function update() {
            if (!isDialogActive) {
                // Update Keyboard Input jika ada
                if (keys['w'] || keys['arrowup']) player.vy = -player.speed;
                else if (keys['s'] || keys['arrowdown']) player.vy = player.speed;
                else if (!joyActive) player.vy = 0;

                if (keys['a'] || keys['arrowleft']) player.vx = -player.speed;
                else if (keys['d'] || keys['arrowright']) player.vx = player.speed;
                else if (!joyActive) player.vx = 0;

                // Terapkan Pergerakan
                player.x += player.vx;
                player.y += player.vy;

                // Batasi pemain agar tidak keluar peta
                if (player.x < 0) player.x = 0;
                if (player.y < 0) player.y = 0;
                if (player.x > WORLD_W - player.width) player.x = WORLD_W - player.width;
                if (player.y > WORLD_H - player.height) player.y = WORLD_H - player.height;

                // Efek animasi berjalan (naik turun)
                if (player.vx !== 0 || player.vy !== 0) {
                    player.animOffset = (Math.sin(Date.now() / 100) * 5);
                } else {
                    player.animOffset = 0;
                }

                // AI NPC (Gerak Random Sederhana)
                npcs.forEach(npc => {
                    if (npc.scene === currentScene) {
                        // NPC berdiri diam jika dia adalah target quest saat ini
                        if (npc.id === currentQuest) return;

                        if (!npc.moveTimer) npc.moveTimer = 0;
                        npc.moveTimer++;
                        
                        if (npc.moveTimer > 100) {
                            npc.moveTimer = 0;
                            // 50% ganti arah, 50% diam
                            if (Math.random() > 0.5) {
                                npc.vx = (Math.random() - 0.5) * 4;
                                npc.vy = (Math.random() - 0.5) * 4;
                            } else {
                                npc.vx = 0;
                                npc.vy = 0;
                            }
                        }

                        // Update posisi NPC
                        if(npc.vx) npc.x += npc.vx;
                        if(npc.vy) npc.y += npc.vy;

                        // Jaga NPC tidak keluar map
                        npc.x = Math.max(0, Math.min(npc.x, WORLD_W - 60));
                        npc.y = Math.max(0, Math.min(npc.y, WORLD_H - 80));
                    }
                });
            }

            // Update Kamera agar mengikuti pemain
            camera.x = player.x - (canvas.width / 2) + (player.width / 2);
            camera.y = player.y - (canvas.height / 2) + (player.height / 2);

            // Batas kamera
            camera.x = Math.max(0, Math.min(camera.x, WORLD_W - canvas.width));
            camera.y = Math.max(0, Math.min(camera.y, WORLD_H - canvas.height));
        }

        function draw() {
            // Bersihkan Layar
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Gambar Lingkungan
            drawBackground();

            // Kumpulkan semua objek yang akan digambar untuk Z-Sorting (Depth)
            let renderList = [];

            // 1. Masukkan Objek Lingkungan
            objects.forEach(obj => {
